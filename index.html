",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by oxidation with a heavy metal.\",\"subtitle\":\"Indicate: the structure of the protecting group and its abbreviation, type of protection, conditions of protection and removal.\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"O,O-Acetals\",\"S,S-Acetals\"],\"protectionTypeOptions\":[\"Acetals\",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides\",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"S,S-Acetals\",\"baseImage\":\"./uploads/1776160057060-Carboxyl.png\",\"imageMapping\":{\"O,O-Acetals\":\"./uploads/1776160060247-O,O-Acetals.png\",\"S,S-Acetals\":\"./uploads/1776160064451-S,S-Acetals.png\"},\"arrow1Options\":[\"Propane-1,3-diol, TsOH\",\"Propane-1,3-dithiol, TsOH\"],\"arrow1Correct\":\"Propane-1,3-diol, TsOH\",\"arrow1Improvable\":[],\"arrow2Options\":[\"TsOH, H₂O, acetone or aq. HCl, TFA\",\"Hg(ClO₄)₂\"],\"arrow2Correct\":\"TsOH, H₂O, acetone or aq. HCl, TFA\",\"arrow2Improvable\":[],\"correctAbbreviations\":[\"S,S-Acetals\"],\"flowMapping\":{\"S,S-Acetals\":{\"arrow1\":\"Propane-1,3-dithiol, TsOH\",\"arrow2\":\"Hg(ClO₄)₂\",\"protectionType\":\"Acetals\"}}}]}"

      "module_id": 2,
      "json_structure": "{\"headerImage\":\"\",\"globalStatement\":\"**Determine whether the following statements related to the use of protecting groups are True or False**\",\"globalReadMoreBlocks\":[],\"questions\":[{\"id\":\"q_1775030818535\",\"type\":\"true_false\",\"title\":\"Protecting groups are used to temporarily mask reactive functional groups during a multistep synthesis.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Protecting groups prevent a functional group from reacting while other transformations are carried out elsewhere in the molecule.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030851170\",\"type\":\"true_false\",\"title\":\"A good protecting group should be easy to introduce and remove under mild conditions.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Efficient protecting groups can be introduced using simple reaction steps and can be removed without affecting the rest of the molecule.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030885146_586\",\"type\":\"true_false\",\"title\":\"The use of protecting groups increases the number of steps in a synthetic route.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Protection and deprotection steps add extra reactions, which can increase time, cost, and reduce overall yield.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030900945_696\",\"type\":\"true_false\",\"title\":\"Protecting groups are unnecessary if a reaction is perfectly chemoselective.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"If the reaction selectively affects only the desired functional group, there is no need to mask others.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030926272_645\",\"type\":\"true_false\",\"title\":\"A protecting group should ideally be inert to the reagents used in subsequent reaction steps.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"The protecting group must remain stable throughout the synthesis.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030946307_831\",\"type\":\"true_false\",\"title\":\"Two protecting groups are orthogonal if one can be selectively removed without affecting the other and in any order. \",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Orthogonal strategies use protecting groups that respond to different conditions, enabling selective deprotection.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775030962644_207\",\"type\":\"true_false\",\"title\":\"Protecting groups are rarely used in the synthesis of complex molecules.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Protecting groups are frequently used in the synthesis of complex molecules.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true},{\"id\":\"q_1775030974720_288\",\"type\":\"true_false\",\"title\":\"The use of protecting groups is always avoided in modern synthetic design because they reduce atom economy.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Although chemists try to minimize protecting group steps to improve efficiency and sustainability, they are still frequently necessary in complex syntheses.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true},{\"id\":\"q_1775030993448_300\",\"type\":\"true_false\",\"title\":\"The incorporation of a protecting group may change steric hindrance around a reactive center.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Protecting groups can introduce steric bulk, which can affect reaction rates, selectivity, or accessibility of nearby functional groups.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"true\",\"hasCorrection\":true},{\"id\":\"q_1775031009314_905\",\"type\":\"true_false\",\"title\":\"A protecting group must always be introduced before any other reaction step in a synthesis.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Protection is introduced only when needed, and the timing depends on the sequence of reactions.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true},{\"id\":\"q_1775031040376_313\",\"type\":\"true_false\",\"title\":\"A protecting group strategy that requires harsh conditions for removal is always unsuitable.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"Harsh conditions may still be acceptable if the rest of the molecule is stable under those conditions.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true},{\"id\":\"q_1775031054741_906\",\"type\":\"true_false\",\"title\":\"The use of protecting groups generally improves the overall yield of a synthesis by preventing side reactions.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"While protecting groups can prevent undesired reactions, the additional steps usually lower overall yield, since each step has its own inefficiencies.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true},{\"id\":\"q_1775031068527_114\",\"type\":\"true_false\",\"title\":\"Protecting groups are unnecessary when two functional groups have identical reactivity.\",\"subtitle\":\"\",\"imageUrl\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"If two groups have similar reactivity, it may actually be more necessary to protect one to achieve selective reaction.\",\"explanationCorrectImage\":\"\",\"correctAnswer\":\"false\",\"hasCorrection\":true}]}"
    },

n, TsOH\",\"Ac₂O, pyr\",\"AllBr, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"BOMCl, DIEA\",\"BzCl, pyr\",\"MEMCl, DIEA\",\"MOMCl, DIEA\",\"PMBCl, pyr\",\"PvCl, pyr\",\"SEMCl, DIEA\",\"TBDMSCl or TBSCl, imidazole\",\"TBDPSCl, imidazole\",\"TIPSCl, imidazole\",\"TrocCl, pyr\",\"TrtCl, pyr\"],\"arrow1Correct\":\"2-Methylprop-1-ene, TsOH or H₂SO₄\",\"arrow1Improvable\":[],\"arrow2Options\":[\"1% TFA, CH₂Cl₂\",\"1M HCl-dioxane or 50-90% TFA, CH₂Cl₂\",\"AcOH-H₂O (4:1)\",\"DDQ or CAN\",\"H₂, Pd/C or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"H₂, Pd/C or HF or Na, NH₃ liq.\",\"HCl, EtOH aq. or TFA, CH₂Cl\",\"NH₃, MeOH or NaOH, MeOH or K₂CO₃, MeOH aq.\",\"Pd(PPh₃)₄, AcOH\",\"Pd(PPh₃)₄, morpholine\",\"TBAF or 50% AcOH\",\"TBAF or 80% AcOH\",\"TBAF or HCl, EtOH aq. or TFA, CH₂Cl\",\"TBAF or HCl, MeOH\",\"Zn, AcOH\",\"ZnBr₂, CH₂Cl₂ or HCl, EtOH aq. or TFA, CH₂Cl₂\"],\"arrow2Correct\":\"1M HCl-dioxane or 50-90% TFA, CH₂Cl₂\",\"arrow2Improvable\":[],\"correctAbbreviations\":[\"Ac\",\"Bz\",\"Pv\"],\"flowMapping\":{\"Ac\":{\"arrow1\":\"Ac₂O, pyr\",\"arrow2\":\"NH₃, MeOH or NaOH, MeOH or K₂CO₃, MeOH aq.\",\"protectionType\":\"Esters\"},\"Bz\":{\"arrow1\":\"BzCl, pyr\",\"arrow2\":\"NH₃, MeOH or NaOH, MeOH or K₂CO₃, MeOH aq.\",\"protectionType\":\"Esters\"},\"Pv\":{\"arrow1\":\"PvCl, pyr\",\"arrow2\":\"NH₃, MeOH or NaOH, MeOH or K₂CO₃, MeOH aq.\",\"protectionType\":\"Esters\"}},\"readMoreBlocks\":[{\"text\":\"Acetyl (Ac), benzoyl (Bz) and pivaloyl (Pv) esters can be removed by basic hydrolysis because the ester bond is susceptible to nucleophilic attack under basic conditions, releasing the free hydroxyl group. \\n\\nSee *Chapter 3*, section *3.2.1*\",\"imageUrl\":\"./uploads/1780043384884-Ac, Bz, Pv.png\"},{\"text\":\"Reactivity order: *Pv<Bz<Ac*\",\"imageUrl\":\"\"}]},{\"id\":\"q_1779264100977_867\",\"type\":\"abbreviation_flow\",\"title\":\"Choose two protecting groups, belonging to different famililes of compounds, that can be removed by treatment with acid\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"All\",\"Alloc\",\"Bn\",\"BOM\",\"ᵗBu\",\"Bz\",\"MEM\",\"MOM\",\"PMB\",\"Pv\",\"SEM\",\"TBDMS\",\"TBDPS\",\"THP\",\"TIPS\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Acetals \",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"THP\",\"baseImage\":\"./uploads/1779263921440-OH.png\",\"imageMapping\":{\"Ac\":\"./uploads/1779263127899-Ac.png\",\"Alloc\":\"./uploads/1779263130752-Alloc.png\",\"BOM\":\"./uploads/1779263133558-BOM.png\",\"Bn\":\"./uploads/1779263136393-Bn.png\",\"Bz\":\"./uploads/1779263142952-Bz.png\",\"MEM\":\"./uploads/1779263147329-MEM.png\",\"MOM\":\"./uploads/1779263150306-MOM.png\",\"PMB\":\"./uploads/1779263155160-PMB.png\",\"Pv\":\"./uploads/1779263159116-Pv.png\",\"SEM\":\"./uploads/1779263163174-SEM.png\",\"TBDMS\":\"./uploads/1779263166672-TBDMS.png\",\"TBDPS\":\"./uploads/1779263170261-TBDPS.png\",\"THP\":\"./uploads/1779263173996-THP.png\",\"TIPS\":\"./uploads/1779263177556-TIPS.png\",\"Troc\":\"./uploads/1779263190433-Troc.png\",\"Trt\":\"./uploads/1779263180797-Tr.png\",\"ᵗBu\":\"./uploads/1779263194439-tBu.png\",\"All\":\"./uploads/1780050946861-Allyl.png\"},\"arrow1Options\":[\"2-Methylprop-1-ene, TsOH or H₂SO₄\",\"3,4-Dihydro-2𝐻-pyran, TsOH\",\"Ac₂O, pyr\",\"AllBr, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"BOMCl, DIEA\",\"BzCl, pyr\",\"MEMCl, DIEA\",\"MOMCl, DIEA\",\"PMBCl, pyr\",\"PvCl, pyr\",\"SEMCl, DIEA\",\"TBDMSCl or TBSCl, imidazole\",\"TBDPSCl, imidazole\",\"TIPSCl, imidazole\",\"TrocCl, pyr\",\"TrtCl, pyr\"],\"arrow1Correct\":\"2-Methylprop-1-ene TSOH or H₂SO₄\",\"arrow1Improvable\":[\"BOMCl, DIEA\",\"SEMCl, DIEA\"],\"arrow2Options\":[\"1% TFA, CH₂Cl₂\",\"1M HCl-dioxane or 50-90% TFA, CH₂Cl₂\",\"AcOH-H₂O (4:1)\",\"DDQ or CAN\",\"H₂, Pd/C or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"H₂, Pd/C or HF or Na, NH₃ liq.\",\"HCl, EtOH aq. or TFA, CH₂Cl\",\"NH₃, MeOH or NaOH, MeOH or K₂CO₃, MeOH aq.\",\"Pd(PPh₃)₄, AcOH\",\"Pd(PPh₃)₄, morpholine\",\"TBAF or 50% AcOH\",\"TBAF or 80% AcOH\",\"TBAF or HCl, EtOH aq. or TFA, CH₂Cl\",\"TBAF or HCl, MeOH\",\"Zn, AcOH\",\"ZnBr₂, CH₂Cl₂ or HCl, EtOH aq. or TFA, CH₂Cl₂\"],\"arrow2Correct\":\"1M HCl-dioxane or TFA, CH₂Cl₂\",\"arrow2Improvable\":[\"TBAF or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"H₂, Pd/C or HCl, EtOH aq. or TFA, CH₂Cl₂\"],\"correctAbbreviations\":[\"THP\",\"MOM\",\"MEM\",\"ᵗBu\",\"Trt\"],\"flowMapping\":{\"THP\":{\"arrow1\":\"3,4-Dihydro-2𝐻-pyran, TsOH\",\"arrow2\":\"AcOH-H₂O (4:1)\",\"protectionType\":\"Acetals \",\"readMoreBlocks\":[{\"text\":\"THP, MOM and MEM are acetal-type protecting groups for alcohols. They can be removed by treatment with acid because the acid protonates the oxygen atoms of the acetal making it susceptible to cleavage, releasing the free hydroxyl group. \\n\\nThey are stable to: bases, organometallics (low T), oxidants, reductants, and alkylating agents. \\n\\nSee *Chapter 3*, section *3.2.2*\",\"imageUrl\":\"\"},{\"text\":\"*Mechanism of MOM removal:*\",\"imageUrl\":\"./uploads/1779972922223-MOM removal.png\"},{\"text\":\"*Mechanism of MEM removal:*\\n\\nThe MEM group can be removed by acid hydrolysis following following a mechanism similar to that of  MOM. Additionally, the presence of an additional oxygen facilitates its removal with a Lewis acid as ZnBr or TiCl₄. \",\"imageUrl\":\"./uploads/1779973129721-MEM removal.png\"},{\"text\":\"*Mechanism of THP removal:*\",\"imageUrl\":\"./uploads/1779973152972-THP.png\"}]},\"MOM\":{\"arrow1\":\"MOMCl, DIEA\",\"arrow2\":\"HCl, EtOH aq. or TFA, CH₂Cl\",\"protectionType\":\"Acetals \",\"readMoreBlocks\":[{\"text\":\"THP, MOM and MEM are acetal-type protecting groups for alcohols. They can be removed by treatment with acid because the acid protonates the oxygen atoms of the acetal making it susceptible to cleavage, releasing the free hydroxyl group. \\n\\nThey are stable to: bases, organometallics (low T), oxidants, reductants, and alkylating agents. \\n\\nSee *Chapter 3*, section *3.2.2*\",\"imageUrl\":\"\"},{\"text\":\"*Mechanism of MOM removal:*\",\"imageUrl\":\"./uploads/1780042811066-MOM removal.png\"},{\"text\":\"*Mechanism of MEM removal:*\\n\\nThe MEM group can be removed by acid hydrolysis following following a mechanism similar to that of  MOM. Additionally, the presence of an additional oxygen facilitates its removal with a Lewis acid as ZnBr or TiCl₄.\",\"imageUrl\":\"./uploads/1780042941060-MEM removal.png\"},{\"text\":\"*Mechanism of THP removal:*\",\"imageUrl\":\"./uploads/1780042954975-THP.png\"}]},\"MEM\":{\"arrow1\":\"MEMCl, DIEA\",\"arrow2\":\"ZnBr₂, CH₂Cl₂ or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"protectionType\":\"Acetals \",\"readMoreBlocks\":[{\"text\":\"THP, MOM and MEM are acetal-type protecting groups for alcohols. They can be removed by treatment with acid because the acid protonates the oxygen atoms of the acetal making it susceptible to cleavage, releasing the free hydroxyl group. \\n\\nThey are stable to: bases, organometallics (low T), oxidants, reductants, and alkylating agents. \\n\\nSee *Chapter 3*, section *3.2.2*\",\"imageUrl\":\"\"},{\"text\":\"*Mechanism of MOM removal:*\",\"imageUrl\":\"./uploads/1780042816657-MOM removal.png\"},{\"text\":\"*Mechanism of MEM removal:*\\n\\nThe MEM group can be removed by acid hydrolysis following following a mechanism similar to that of  MOM. Additionally, the presence of an additional oxygen facilitates its removal with a Lewis acid as ZnBr or TiCl₄.\",\"imageUrl\":\"./uploads/1780042932466-MEM removal.png\"},{\"text\":\"*Mechanism of THP removal:*\",\"imageUrl\":\"./uploads/1780042968856-THP.png\"}],\"readMoreImprovableBlocks\":[]},\"Trt\":{\"arrow1\":\"TrtCl, pyr\",\"arrow2\":\"1% TFA, CH₂Cl₂\",\"protectionType\":\"Ethers\",\"readMoreBlocks\":[{\"text\":\"/t/Butyl (/t/Bu) and trityl (Trt) groups are typically removed under acidic conditions because the protonation of the ether oxygen facilitates cleavage of the C-O bond through the formation of a stable carbocation. \\n\",\"imageUrl\":\"./uploads/1780043403996-tBu i Trt.png\"},{\"text\":\"The tert-butyl cation is less stabilized than the trityl cation, no stronger acidic conditions are required. They are stable to most reagents except acids. \",\"imageUrl\":\"\"}]},\"ᵗBu\":{\"arrow1\":\"2-Methylprop-1-ene TSOH or H₂SO₄\",\"arrow2\":\"1M HCl-dioxane or 50-90% TFA, CH₂Cl₂\",\"protectionType\":\"Ethers\",\"readMoreBlocks\":[{\"text\":\"/t/Butyl (/t/Bu) and trityl (Trt) groups are typically removed under acidic conditions because the protonation of the ether oxygen facilitates cleavage of the C-O bond through the formation of a stable carbocation. \\n\",\"imageUrl\":\"./uploads/1780043398614-tBu i Trt.png\"},{\"text\":\"The tert-butyl cation is less stabilized than the trityl cation, no stronger acidic conditions are required. They are stable to most reagents except acids. \",\"imageUrl\":\"\"}]}},\"readMoreBlocks\":[],\"allowTwo\":true,\"improvableCombinations\":[{\"abbreviation\":\"BOM\",\"arrow1\":\"BOMCl, DIEA\",\"arrow2\":\"TBAF or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"readMoreBlocks\":[{\"text\":\"The BOM group, being an acetal-type protecting group, can be removed by acidic hydrolysis, similarly to MOM and MEM groups. However, because it also contains a benzyl ether moiety, *it is more commonly removed by hydrogenolysis using H₂/Pd*.\",\"imageUrl\":\"\"}],\"protectionType\":\"Ethers\"},{\"abbreviation\":\"SEM\",\"arrow1\":\"SEMCl, DIEA\",\"arrow2\":\"TBAF or HCl, EtOH aq. or TFA, CH₂Cl₂\",\"readMoreBlocks\":[{\"text\":\"The SEM group, being an acetal-type protecting group, can be removed by acidic hydrolysis, similarly to MOM and MEM groups. Because it also contains a silyl moiety, *it is more commonly removed using TFA*.\",\"imageUrl\":\"\"}],\"protectionType\":\"Ethers\"}]},{\"id\":\"q_1779265219078_279\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protectin  by acidic hydrolysis. \\n\\n*Chapter 3, sections 3.2.2, 3.3.1*\",\"imageUrl\":\"\"},{\"text\":\"Mechanism of benzyl group removal: \\n\\n*Chapter 3 section 3.2.7*\",\"imageUrl\":\"\"}]},{\"id\":\"q_1779268661352_893\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by transition metal catalysis \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"All\",\"Alloc\",\"Bn\",\"BOM\",\"ᵗBu\",\"Bz\",\"MEM\",\"MOM\",\"PMB\",\"Pv\",\"SEM\",\"TBDMS\",\"TBDPS\",\"THP\",\"TIPS\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Acetals \",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"Alloc\",\"baseImage\":\"./uploads/1779263921440-OH.png\",\"imageMapping\":{\"Ac\":\"./uploads/1779263127899-Ac.png\",\"Alloc\":\"./uploads/1779263130752-Alloc.png\",\"BOM\":\"./uploads/1779263133558-BOM.png\",\"Bn\":\"./uploads/1779263136393-Bn.png\",\"Bz\":\"./uploads/1779263142952-Bz.png\",\"MEM\":\"./uploads/1779263147329-MEM.png\",\"MOM\":\"./uploads/1779263150306-MOM.png\",\"PMB\":\"./uploads/1779263155160-PMB.png\",\"Pv\":\"./uploads/1779263159116-Pv.png\",\"SEM\":\"./uploads/1779263163174-SEM.png\",\"TBDMS\":\"./uploads/1779263166672-TBDMS.png\",\"TBDPS\":\"./uploads/1779263170261-TBDPS.png\",\"THP\":\"./uploads/1779263173996-THP.png\",\"TIPS\":\"./uploads/1779263177556-TIPS.png\",\"Troc\":\"./uploads/1779263190433-Troc.png\",\"Trt\":\"./uploads/1779263180797-Tr.png\",\"ᵗBu\":\"./uploads/1779263194439-tBu.png\",\"All\":\"./uploads/1780050986217-Allyl.png\"},\"arrow1Options\":[\"2-Methylprop-1-ene, TsOH or H₂SO₄\",\"3,4-Dihydro-2𝐻-pyran, TsOH\",\"Ac₂O, pyr\",\"AllBr, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"BOMCl, DIEA\",\"BzCl, pyr\",\"MEMCl, DIEA\",\"MOMCl, DIEA\",\"PMBCl, pyr\",\"PvCl, pyr\",\"SEMCl, DIEA\",\"TBDMSCl or TBSCl, imidaz , MeOH \",\"NH₂NH₂, 80ºC, MeOH\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF or DBU, CH₂Cl₂ \",\"TBAF\",\"TBAF or TFA, CH₂Cl₂ or HCl aq., EtOH\",\"Zn, AcOH\"],\"arrow2Correct\":\"1% TFA, CH₂Cl₂ or AcOH\",\"arrow2Improvable\":[],\"correctAbbreviations\":[\"CF₃CO\"],\"flowMapping\":{\"CF₃CO\":{\"arrow1\":\"(CF₃CO₂)O, pyr\",\"arrow2\":\"K₂CO₃, MeOH aq. or NH₃, MeOH \",\"protectionType\":\"Amides\"}},\"readMoreBlocks\":[{\"text\":\"See *Chapter 3*, section *3.3.4*, *3.2.1*\\n\\nAmides, such as *acetamides* or *benzamides*, are highly stable functional groups used to protect reactive amines during complex organic synthesis. However, since these amides are very robust, their removal usually requires harsh acidic or basic conditions. Thus, other amides, such as trifluoroacetamides, or other protecting groups such as carbamates are preferred. \",\"imageUrl\":\"\"},{\"text\":\"*Trifluoroacetamides* can be easily cleaved under mild basic conditions due to the presence of the highly electron-withdrawing trifluoromethyl group. \",\"imageUrl\":\"\"},{\"text\":\"Mechanism: \",\"imageUrl\":\"./uploads/1780060825246-CF3.png\"}],\"showInitialReadMore\":true,\"initialReadMoreBlocks\":[{\"text\":\"The experimental conditions used for the introduction and removal of these groups are summarized in *Chapter 3*, sections *3.2* and *3.3.4*\",\"imageUrl\":\"\"}]},{\"id\":\"q_1779787264533_628\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by treatment with hydrazine\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"Alloc\",\"Bn\",\"Boc\",\"Bz\",\"Cbz=Z\",\"CF₃CO\",\"Fmoc\",\"Phth\",\"SEM\",\"Teoc\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Amides\",\"Carbamate\",\"Carbonate\",\"Ester\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"Phth\",\"baseImage\":\"./uploads/1775 \":\"\"}]},{\"id\":\"q_1779788461095_767\",\"type\":\"abbreviation_flow\",\"title\":\"Choose two protecting groups, belonging to different families of compounds, that can be removed by treatment with acid. \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"Alloc\",\"Bn\",\"Boc\",\"Bz\",\"Cbz=Z\",\"CF₃CO\",\"Fmoc\",\"Phth\",\"SEM\",\"Teoc\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Amides\",\"Carbamate\",\"Carbonate\",\"Ester\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"Boc\",\"baseImage\":\"./uploads/1775645391263-Amino R-NH2.png\",\"imageMapping\":{\"Ac\":\"./uploads/1775645395026-Ac.png\",\"Alloc\":\"./uploads/1775645399240-Alloc.png\",\"Bn\":\"./uploads/1775645402788-Bn.png\",\"Boc\":\"./uploads/1775645406439-Boc.png\",\"Bz\":\"./uploads/1775645410146-Bz.png\",\"Cbz=Z\":\"./uploads/1775645413973-Cbx=Z.png\",\"Fmoc\":\"./uploads/1775645418625-Fmoc.png\",\"Phth\":\"./uploads/1775645422544-Phth.png\",\"SEM\":\"./uploads/1775645426726-SEM.png\",\"TFAc\":\"./uploads/1775645437331-CF3.png\",\"Teoc\":\"./uploads/1775645444732-Teoc.png\",\"Troc\":\"./uploads/1775645448137-Tr.png\",\"CF₃CO\":\"./uploads/1779786936294-CF3.png\",\"Trt\":\"./uploads/1779786942032-Tr.png\"},\"arrow1Options\":[\"(CF₃CO₂)O, pyr\",\"Ac₂O, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"Boc₂O, NaHCO₃\",\"BzCl, pyr\",\"FmocCl, DIEA \",\"Phthalic anhydride, Ac₂O, pyr\",\"SEMCl, pyr\",\"TeocCl, DIEA\",\"TrocCl, pyr\",\"TrtCl, pyr\",\"ZCl, DIEA\"],\"arrow1Correct\":\"(CF₃CO) ₂O\",\"arrow1Improvable\":[\"Ac₂O, pyr\",\"BzCl, pyr\"],\"arrow2Options\":[\"1% TFA, CH₂Cl₂ or AcOH\",\"50-90% TFA, CH₂Cl₂\",\"H₂, Pd/C \",\"H₂, Pd/C, HCO₂H or Na, NH₃ liq. \",\"HCl aq. 6 N reflux\",\"K₂CO₃, MeOH aq. or NH₃, MeOH \",\"NH₂NH₂, 80ºC, MeOH\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF or DBU, CH₂Cl₂ \",\"TBAF\",\"TBAF or TFA, CH₂Cl₂ or HCl aq., EtOH\",\"Zn, AcOH\"],\"arrow2Correct\":\"1% TFA, CH₂Cl₂\",\"arrow2Improvable\":[\"HCl aq. 6N reflux\"],\"correctAbbreviations\":[\"Boc\",\"Trt\",\"SEM\"],\"flowMapping\":{\"Phth\":{\"arrow1\":\"Phtalic anhydride, Ac₂O, pyr\",\"arrow2\":\"NH₂NH₂, MeOH\",\"protectionType\":\"Imides \"},\"Boc\":{\"arrow1\":\"Boc₂O, NaHCO₃\",\"arrow2\":\"50-90% TFA, CH₂Cl₂\",\"protectionType\":\"Carbamate\",\"readMoreBlocks\":[{\"text\":\"The Boc group is a widely used amino protecting group. It is stable to basic hydrolysis, many nucleophiles as well as catalytic hydrogenation. It can be removed under mild acidic conditions with TFA. \",\"imageUrl\":\"\"},{\"text\":\"Mechanism of Boc removal: \",\"imageUrl\":\"./uploads/1780060984584-Boc.png\"},{\"text\":\"See *Chapter 3*, section 3.2.2, 3.3.4\",\"imageUrl\":\"\"}]},\"Trt\":{\"arrow1\":\"TrtCl, pyr\",\"arrow2\":\"1% TFA, CH₂Cl₂\",\"protectionType\":\"N-Alkyl derivatives \",\"readMoreBlocks\":[{\"text\":\"The triphenylmethyl (Trt) group is a bulky, acid-labile protecting group used to protect a variety of primary and secondary amines. It is stable under basic conditions, nucleophilic attack, and reducing agents.\\nIt can be removed under milder acidic conditions (1-2% TFA) than the Boc group because a highly stable trityl cation is formed.\\n\\nSee *Chapter 3*, section *3.2.2*, *3.3.4*\\n\\nMechanism of Trt removal: \",\"imageUrl\":\"./uploads/1780061122175-Trt.png\"},{\"text\":\"The SEM group can be used to protect amines as an amino acetal derivative. It is especially useful for amino groups in heterocycles such as indoles, imidazoles, and pyrroles. The SEM group is stable to bases, reducing agents, organometallic reagents, palladium-catalyzed cross-couplings, and catalytic hydroformation. The SEM group can be removed under acidic conditions (TFA or HCl) and also with fluoride ions (TBAF). \\n\\nMechanism of SEM removal under acidic conditions: \",\"imageUrl\":\"./uploads/1780061340631-SEM.png\"}]},\"SEM\":{\"arrow1\":\"SEMCl, pyr\",\"arrow2\":\"TBAF or TFA, CH₂Cl₂ or HCl aq., EtOH\",\"protectionType\":\"N-Alkyl derivatives \",\"readMoreBlocks\":[{\"text\":\"The triphenylmethyl (Trt) group is a bulky, acid-labile protecting group used to protect a variety of primary and secondary amines. It is stable under basic conditions, nucleophilic attack, and reducing agents.\\nIt can be removed under milder acidic conditions (1-2% TFA) than the Boc group because a highly stable trityl cation is formed.\\n\\nSee *Chapter 3*, section *3.2.2*, *3.3.4*\\n\\nMechanism of Trt removal: \",\"imageUrl\":\"./uploads/1780061382183-Trt.png\"},{\"text\":\"The SEM group can be used to protect amines as an amino acetal derivative. It is especially useful for amino groups in heterocycles such as indoles, imidazoles, and pyrroles. The SEM group is stable to bases, reducing agents, organometallic reagents, palladium-catalyzed cross-couplings, and catalytic hydroformation. The SEM group can be removed under acidic conditions (TFA or HCl) and also with fluoride ions (TBAF). \\n\\nMechanism of SEM removal under acidic conditions: \",\"imageUrl\":\"./uploads/1780061390851-SEM.png\"}]}},\"readMoreBlocks\":[],\"allowTwo\":true},{\"id\":\"q_1779788804628_172\",\"type\":\"abbreviation_flow\",\"title\":\"Chose one protecting group that can be removed by a β-elimination reaction\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"Alloc\",\"Bn\",\"Boc\",\"Bz\",\"Cbz=Z\",\"CF₃CO\",\"Fmoc\",\"Phth\",\"SEM\",\"Teoc\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Amides\",\"Carbamate\",\"Carbonate\",\"Ester\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"Fmoc\",\"baseImage\":\"./uploads/1775645391263-Amino R-NH2.png\",\"imageMapping\":{\"Ac\":\"./uploads/1775645395026-Ac.png\",\"Alloc\":\"./uploads/1775645399240-Alloc.png\",\"Bn\":\"./uploads/1775645402788-Bn.png\ t is usually removed by treatment with secondary amines, such as piperidine. DBU can also be employed.\\n\\nSee *Chapter 3*, section *3.2.6*, *3.3.4* \",\"imageUrl\":\"\"},{\"text\":\"Mecahnism of Fmoc removal: \\n\\nSee *Chapter 3*, section *3.2.6* \",\"imageUrl\":\"\"}],\"allowTwo\":false,\"showInitialReadMore\":false},{\"id\":\"q_1779788984934_648\",\"type\":\"abbreviation_flow\",\"title\":\"Chose one protecting group that can be removed by reductive elimination with Zn\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"Alloc\",\"Bn\",\"Boc\",\"Bz\",\"Cbz=Z\",\"CF₃CO\",\"Fmoc\",\"Phth\",\"SEM\",\"Teoc\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Amides\",\"Carbamate\",\"Carbonate\",\"Ester\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"Troc\",\"baseImage\":\"./uploads/1775645391263-Amino R-NH2.png\",\"imageMapping\":{\"Ac\":\"./uploads/1775645395026-Ac.png\",\"Alloc\":\"./uploads/1775645399240-Alloc.png\",\"Bn\":\"./uploads/1775645402788-Bn.png\",\"Boc\":\"./uploads/1775645406439-Boc.png\",\"Bz\":\"./uploads/1775645410146-Bz.png\",\"Cbz=Z\":\"./uploads/1775645413973-Cbx=Z.png\",\"Fmoc\":\"./uploads/1775645418625-Fmoc.png\",\"Phth\":\"./uploads/1775645422544-Phth.png\",\"SEM\":\"./uploads/1775645426726-SEM.png\",\"TFAc\":\"./uploads/1775645437331-CF3.png\",\"Teoc\":\"./uploads/1775645444732-Teoc.png\",\"Troc\":\"./uploads/1775645448137-Tr.png\",\"CF₃CO\":\"./uploads/1779786936294-CF3.png\",\"Trt\":\"./uploads/1779786942032-Tr.png\"},\"arrow1Options\":[\"(CF₃CO₂)O, pyr\",\"Ac₂O, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"Boc₂O, NaHCO₃\",\"BzCl, pyr\",\"FmocCl, DIEA \",\"Phthalic anhydride, Ac₂O, pyr\",\"SEMCl, pyr\",\"TeocCl, DIEA\",\"TrocCl, pyr\",\"TrtCl, pyr\",\"ZCl, DIEA\"],\"arrow1Correct\":\"(CF₃CO) ₂O\",\"arrow1Improvable\":[],\"arrow2Options\":[\"1% TFA, CH₂Cl₂ or AcOH\",\"50-90% TFA, ncluding Grignard reagents, strong bases and most oxidants. \\n\\nSee *Chapter 3*, sections *3.2.7*, *3.3.4*\",\"imageUrl\":\"\"},{\"text\":\"The Bn group is useful as ammonia equivalent: \",\"imageUrl\":\"./uploads/1780061658486-Bn1.png\"},{\"text\":\"It is also useful when multiple protection of the amino acid group is required \",\"imageUrl\":\"./uploads/1779789953312-Bn2.png\"},{\"text\":\"Benzyloxycarboxonyl (Cbz or Z) is one of the most common amino protecting groups. It protects amines as carbamates. It is stable under mild and moderate acid conditions, to aqueous bases and amines, and to mild oxidizing agents. It is unstable to very strong acids (HBr, HF) or to reduction by metals (Na/NH₃).\\n\\nThus, it is orthogonal to Boc, Trt and Fmoc groups. Bn and Cbz groups are usually removed by catalytic hydrogenation. \",\"imageUrl\":\"\"},{\"text\":\"Mechanism of Bn and Cbz removal: \\n\\nSee *Chapter 3*, section *3.2.7* \",\"imageUrl\":\"\"}],\"allowTwo\":false,\"showInitialReadMore\":false},{\"id\":\"q_1779790424481_4\",\"type\":\"abbreviation_flow\",\"title\":\"Chose one protecting group that can be removed by treatment with fluoride \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"explanationImprovable\":\"\",\"explanationImprovableImage\":\"\",\"abbreviationOptions\":[\"Ac\",\"Alloc\",\"Bn\",\"Boc\",\"Bz\",\"Cbz=Z\",\"CF₃CO\",\"Fmoc\",\"Phth\",\"SEM\",\"Teoc\",\"Troc\",\"Trt\"],\"protectionTypeOptions\":[\"Amides\",\"Carbamate\",\"Carbonate\",\"Ester\",\"Imides \",\"N-Alkyl derivatives \"],\"correctAbbreviation\":\"SEM\",\"baseImage\":\"./uploads/1775645391263-Amino R-NH2.png\",\"imageMapping\":{\"Ac\":\"./uploads/1775645395026-Ac.png\",\"Alloc\":\"./uploads/1775645399240-Alloc.png\",\"Bn\":\"./uploads/1775645402788-Bn.png\",\"Boc\":\"./uploads/1775645406439-Boc.png\",\"Bz\":\"./uploads/1775645410146-Bz.png\",\"Cbz=Z\":\"./uploads/1775645413973-Cbx=Z.png\",\"Fmoc\":\"./uploads/1775645418625-Fmoc.png\",\"Phth\":\"./uploads/1775645422544-Phth.png\",\"SEM\":\"./uploads/1775645426726-SEM.png\",\"TFAc\":\"./uploads/1775645437331-CF3.png\",\"Teoc\":\"./uploads/1775645444732-Teoc.png\",\"Troc\":\"./uploads/1775645448137-Tr.png\",\"CF₃CO\":\"./uploads/1779786936294-CF3.png\",\"Trt\":\"./uploads/1779786942032-Tr.png\"},\"arrow1Options\":[\"(CF₃CO₂)O, pyr\",\"Ac₂O, pyr\",\"AllocCl, pyr\",\"BnCl, pyr\",\"Boc₂O, NaHCO₃\",\"BzCl, pyr\",\"FmocCl, DIEA \",\"Phthalic anhydride, Ac₂O, pyr\",\"SEMCl, pyr\",\"TeocCl, DIEA\",\"TrocCl, pyr\",\"TrtCl, pyr\",\"ZCl, DIEA\"],\"arrow1Correct\":\"(CF₃CO) ₂O\",\"arrow1Improvable\":[],\"arrow2Options\":[\"1% TFA, CH₂Cl₂ or AcOH\",\"50-90% TFA, CH₂Cl₂\",\"H₂, Pd/C \",\"H₂, Pd/C, HCO₂H or Na, NH₃ liq. \",\"HCl aq. 6 N reflux\",\"K₂CO₃, MeOH aq. or NH₃, MeOH \",\"NH₂NH₂, 80ºC, MeOH\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF or DBU, CH₂Cl₂ \",\"TBAF\",\"TBAF or TFA, CH₂Cl₂ or HCl aq., EtOH\",\"Zn, AcOH\"],\"arrow2Correct\":\"1% TFA, CH₂Cl₂\",\"arrow2Improvable\":[],\"correctAbbreviations\":[\"SEM\",\"Teoc\"],\"flowMapping\":{\"Phth\":{\"arrow1\":\"Phtalic anhydride, Ac₂O, pyr\",\"arrow2\":\"NH₂NH₂, MeOH\",\"protectionType\":\"Imides \"},\"Boc\":{\"arrow1\":\"Boc₂O, NaHCO₃\",\"arrow2\":\"TFA, CH₂Cl₂\",\"protectionType\":\"Carbamate\"},\"Trt\":{\"arrow1\":\"TrtCl, pyr\",\"arrow2\":\"1% TFA, CH₂Cl₂\",\"protectionType\":\"N-Alkyl derivatives \"},\"SEM\":{\"arrow1\":\"SEMCl, pyr\",\"arrow2\":\"TBAF or TFA, CH₂Cl₂ or HCl aq., EtOH\",\"protectionType\":\"N-Alkyl derivatives \"},\"Fmoc\":{\"arrow1\":\"FmocCl, DIEA \",\"arrow2\":\"Piperidine, DMF or DBU, CH₂Cl₂ \",\"protectionType\":\"Carbamate\"},\"Troc\":{\"arrow1\":\"TrocCl, pyr\",\"arrow2\":\"Zn, AcOH\",\"protectionType\":\"Carbamate\"},\"Bn\":{\"arrow1\":\"BnCl, pyr\",\"arrow2\":\"H₂, Pd/C, HCO₂H or HBr, HF or HCO₂H, Na, NH₃ liq. \",\"protectionType\":\"N-Alkyl derivatives \"},\"Cbz=Z\":{\"arrow1\":\"ZCl, DIEA\",\"arrow2\":\"H₂, Pd/C or HBr, HF\",\"protectionType\":\"Carbamate\"},\"Teoc\":{\"arrow1\":\"TeocCl, DIEA\",\"arrow2\":\"TBAF\",\"protectionType\":\"Carbamate\"}},\"readMoreBlocks\":[{\"text\":\"The SEM group can be used to protect amines as an amino-acetal derivative. It is especially useful for amino groups in heterocycles such as indoles, imidazoles, and pyrroles. \\n\\nThe SEM group is stable to bases, reducing agents, organometallic reagents, palladium-catalyzed cross-couplings , and catalytic hydrogenation. \\n\\nThe SEM group can be removed under acidic conditions (TFA or HCl) and also with fluoride ions (TBAF).\",\"imageUrl\":\"./uploads/1779791207769-SEM.png\"},{\"text\":\"The 2-(trimethylsilyl)ethoxycarbonyl (Teoc) group is a widely used carbamate protecting group for primary and secondary amines. It is orthogonal to Fmoc and Cbz groups and it is removed with fluoride ions (TBAF). \",\"imageUrl\":\"\"},{\"text\":\"Mechanism of SEM and Teoc removal: \\n\\nSee *Chapter 3*, section *3.2.4*\",\"imageUrl\":\"\"}],\"allowTwo\":false,\"showInitialReadMore\":false}]}"

CC, DMAP  or BnBr, DBU\"],\"arrow2Improvable\":[\"HF or HBr\"],\"protectionTypeOptions\":[\"Acetals \",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"showExplanations\":true,\"explanationCorrect\":\"Mechanism of /t/-butyl ester formation: \\n\",\"explanationCorrectImage\":\"./uploads/1779088463825-t-butyl ester formation.png\",\"readMoreBlocks\":[{\"text\":\"The tert-butyl (tBu) ester can be removed by acidic treatment because protonation of the carbonyl oxygen facilitates cleavage via a stable tert-butyl carbocation, releasing the free carboxylic acid.\\n\\nMechanism of /t/ -butyl ester formation: \\n\",\"imageUrl\":\"./uploads/1780062082899-t-butyl ester formation.png\"},{\"text\":\"Mechanism of /t/ -butyl ester removal: \",\"imageUrl\":\"./uploads/1780062101008-t-butyl ester removal.png\"}]},{\"id\":\"q_1774355685532_783\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by a β-elimination reaction\",\"subtitle\":\"\",\"abbreviationOptions\":[\"Me\",\"Tce\",\"Bn\",\"All\",\"tBu\",\"Fm\",\"𝑜NB\"],\"correctAbbreviation\":\"Fm\",\"baseImage\":\"./uploads/1774348177337-Carboxyl.png\",\"imageMapping\":{\"Me\":\"./uploads/1774348770292-Me.png\",\"Tce\":\"./uploads/1774348775661-Tce.png\",\"Bn\":\"./uploads/1774348780907-Bn.png\",\"MOM\":\"./uploads/1774348785360-MOM.png\",\"All\":\"./uploads/1774348792607-All.png\",\"tBu\":\"./uploads/1774348796080-tBu.png\",\"Fm\":\"./uploads/1774348802189-Fm.png\",\"𝑜NB\":\"./uploads/1774348817089-oNB.png\"},\"arrow1Options\":[\"(2-Nitrophenyl)methanol, DCC, DMAP \",\"2-Methylprop-1-ene, H₂SO₄\",\"AllBr, Cs₂CO₃\",\"BnOH, DCC, DMAP  or BnBr, DBU\",\"CCl₃CH₂OH, DCC, DMAP\",\"FmOH, DCC, DMAP\",\"MeOH, 5 N HCl or CH₂N₂ or MeI, Cs₂CO₃\"],\"arrow1Correct\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2Options\":[\"aq. HCl, THF\",\"CF₃CO₂H, CH₂Cl₂\",\"H₂, Pd/C\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF\",\"UV, H₂O, dioxane \",\"Zn, AcOH\",\"LiOH, MeOH\",\"HF or HBr\"],\"arrow2Correct\":\"LiOH, MeOH\",\"correctAbbreviations\":[\"Fm\"],\"flowMapping\":{\"MOM\":{\"arrow1\":\"MOMCl, DIEA \",\"arrow2\":\"aq. HCl, THF\"},\"Bn\":{\"arrow1\":\"BnOH, DCC, DMAP  or BnBr, DBU\",\"arrow2\":\"LiOH, MeOH\"},\"tBu\":{\"arrow1\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2\":\"CF₃CO₂H, CH₂Cl₂\"},\"Fm\":{\"arrow1\":\"FmOH, DCC, DMAP\",\"arrow2\":\"Piperidine, DMF\",\"protectionType\":\"Esters\"}},\"arrow1Improvable\":[],\"arrow2Improvable\":[],\"protectionTypeOptions\":[\"Acetals \",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"showExplanations\":true,\"explanationCorrect\":\"Bla bla bla bleh \",\"explanationCorrectImage\":\"./uploads/1774437586085-Fm_Mechanism.png\",\"readMoreBlocks\":[{\"text\":\"The fluorenylmethyl (Fm) group can be removed by β-elimination because treatment with a base (e.g., piperidine) abstracts the benzylic proton, promoting elimination and release of the free carboxylic acid. \\n\\nSee *Chapter 3* section *3.2.6* and *3.3.3*\",\"imageUrl\":\"\"}]},{\"id\":\"q_1774355758492_181\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by reductive elimination with Zn\",\"subtitle\":\"\",\"abbreviationOptions\":[\"Me\",\"Tce\",\"Bn\",\"All\",\"tBu\",\"Fm\",\"𝑜NB\"],\"correctAbbreviation\":\"Tce\",\"baseImage\":\"./uploads/1774348177337-Carboxyl.png\",\"imageMapping\":{\"Me\":\"./uploads/1774348770292-Me.png\",\"Tce\":\"./uploads/1779182782906-Tce.png\",\"Bn\":\"./uploads/1774348780907-Bn.png\",\"MOM\":\"./uploads/1774348785360-MOM.png\",\"All\":\"./uploads/1774348792607-All.png\",\"tBu\":\"./uploads/1774348796080-tBu.png\",\"Fm\":\"./uploads/1774348802189-Fm.png\",\"𝑜NB\":\"./uploads/1774348817089-oNB.png\"},\"arrow1Options\":[\"(2-Nitrophenyl)methanol, DCC, DMAP \",\"2-Methylprop-1-ene, H₂SO₄\",\"AllBr, Cs₂CO₃\",\"BnOH, DCC, DMAP  or BnBr, DBU\",\"CCl₃CH₂OH, DCC, DMAP\",\"FmOH, DCC, DMAP\",\"MeOH, 5 N HCl or CH₂N₂ or MeI, Cs₂CO₃\"],\"arrow1Correct\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2Options\":[\"aq. HCl, THF\",\"CF₃CO₂H, CH₂Cl₂\",\"H₂, Pd/C\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF\",\"UV, H₂O, dioxane \",\"Zn, AcOH\",\"LiOH, MeOH\",\"HF or HBr\"],\"arrow2Correct\":\"LiOH, MeOH\",\"correctAbbreviations\":[\"Tce\"],\"flowMapping\":{\"MOM\":{\"arrow1\":\"MOMCl, DIEA \",\"arrow2\":\"aq. HCl, THF\"},\"Bn\":{\"arrow1\":\"BnOH, DCC, DMAP  or BnBr, DBU\",\"arrow2\":\"LiOH, MeOH\"},\"tBu\":{\"arrow1\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2\":\"CF₃CO₂H, CH₂Cl₂\"},\"Fm\":{\"arrow1\":\"FmOH, DCC, DMAP\",\"arrow2\":\"Piperidine, DMF\"},\"Tce\":{\"arrow1\":\"CCl₃CH₂OH, DCC, DMAP\",\"arrow2\":\"Zn, AcOH\",\"protectionType\":\"Esters\"}},\"arrow1Improvable\":[],\"arrow2Improvable\":[],\"protectionTypeOptions\":[\"Acetals\",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"showExplanations\":true,\"readMoreBlocks\":[{\"text\":\"The trichloroethyl (Tce) ester can be removed by reductive elimination because reduction with zinc facilitates cleavage of the C–O bond, releasing the free carboxylic acid. \\n\\nMechanism of Tce removal: \\n\\nSee *Chapter 3*, sections *3.2.5*, *3.3.3* \",\"imageUrl\":\"\"}]},{\"id\":\"q_1774355803757_44\",\"type\":\"abbreviation_flow\",\"title\":\"Choose one protecting group that can be removed by hydrogenolysis\",\"subtitle\":\"\",\"abbreviationOptions\":[\"Me\",\"Tce\",\"Bn\",\"All\",\"tBu\",\"Fm\",\"𝑜NB\"],\"correctAbbreviation\":\"Bn\",\"baseImage\":\"./uploads/1774348177337-Carboxyl.png\",\"imageMapping\":{\"Me\":\"./uploads/1774348770292-Me.png\",\"Tce\":\"./uploads/1774348775661-Tce.png\",\"Bn\":\"./uploads/1774348780907-Bn.png\",\"MOM\":\"./uploads/1774348785360-MOM.png\",\"All\":\"./uploads/1774348792607-All.png\",\"tBu\":\"./uploads/1774348796080-tBu.png\",\"Fm\":\"./uploads/1774348802189-Fm.png\",\"𝑜NB\":\"./uploads/1774348817089-oNB.png\"},\"arrow1Options\":[\"(2-Nitrophenyl)methanol, DCC, DMAP \ png\",\"imageMapping\":{\"Me\":\"./uploads/1774348770292-Me.png\",\"Tce\":\"./uploads/1774348775661-Tce.png\",\"Bn\":\"./uploads/1774348780907-Bn.png\",\"MOM\":\"./uploads/1774348785360-MOM.png\",\"All\":\"./uploads/1774348792607-All.png\",\"tBu\":\"./uploads/1774348796080-tBu.png\",\"Fm\":\"./uploads/1774348802189-Fm.png\",\"𝑜NB\":\"./uploads/1774348817089-oNB.png\"},\"arrow1Options\":[\"(2-Nitrophenyl)methanol, DCC, DMAP \",\"2-Methylprop-1-ene, H₂SO₄\",\"AllBr, Cs₂CO₃\",\"BnOH, DCC, DMAP  or BnBr, DBU\",\"CCl₃CH₂OH, DCC, DMAP\",\"FmOH, DCC, DMAP\",\"MeOH, 5 N HCl or CH₂N₂ or MeI, Cs₂CO₃\"],\"arrow1Correct\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2Options\":[\"aq. HCl, THF\",\"CF₃CO₂H, CH₂Cl₂\",\"H₂, Pd/C\",\"Pd(PPh₃)₄, morpholine\",\"Piperidine, DMF\",\"UV, H₂O, dioxane \",\"Zn, AcOH\",\"LiOH, MeOH\",\"HF or HBr\"],\"arrow2Correct\":\"LiOH, MeOH\",\"correctAbbreviations\":[\"𝑜NB\"],\"flowMapping\":{\"MOM\":{\"arrow1\":\"MOMCl, DIEA \",\"arrow2\":\"aq. HCl, THF\"},\"Bn\":{\"arrow1\":\"BnOH, DCC, DMAP  or BnBr, DBU\",\"arrow2\":\"LiOH, MeOH\"},\"tBu\":{\"arrow1\":\"MeOH, 5N HCl or CH₂N₂ or MeI, Cs₂CO₃\",\"arrow2\":\"CF₃CO₂H, CH₂Cl₂\"},\"Fm\":{\"arrow1\":\"FmOH, DCC, DMAP\",\"arrow2\":\"Piperidine, DMF\"},\"Tce\":{\"arrow1\":\"CCl₃CH₂OH, DCC, DMAP\",\"arrow2\":\"Zn, AcOH\"},\"All\":{\"arrow1\":\"AllBr, Cs₂CO₃\",\"arrow2\":\"Pd(PPh₃)₄, morpholine\"},\"𝑜NB\":{\"arrow1\":\"(2-Nitrophenyl)methanol, DCC, DMAP \",\"arrow2\":\"UV, H₂O, dioxane \",\"protectionType\":\"Esters\"}},\"arrow1Improvable\":[],\"arrow2Improvable\":[],\"protectionTypeOptions\":[\"Acetals \",\"Amides \",\"Carbonates\",\"Esters\",\"Ethers\",\"Imides \",\"N-Alkyl derivatives \"],\"showExplanations\":true,\"readMoreBlocks\":[{\"text\":\"The o-nitrobenzyl (oNB) ester can be cleaved by light because UV irradiation promotes a photochemical reaction that breaks the benzylic C–O bond, releasing the free carboxylic acid.\",\"imageUrl\":\"\"}]}]}"

      "json_structure": "{\"headerImage\":\"\",\"globalStatement\":\"Choose the correct answer \",\"globalReadMoreBlocks\":[],\"questions\":[{\"id\":\"q_1780062368984\",\"type\":\"multiple_choice\",\"title\":\"Which pair of protecting groups is considered orthogonal? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Boc / tBu\",\"Fmoc / Boc\",\"Boc / Trt\"],\"correctAnswer\":\"Fmoc / Boc\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Boc group is removed with TFA and Fmoc with piperidine. In contrast, tBu and Trt groups are also labile to TFA\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062417402_406\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group is typically removed under basic conditions? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Boc \",\"tBu\",\"Fmoc\",\"Trt\"],\"correctAnswer\":\"Fmoc\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Fmoc is removed with piperidine. Boc, tBu and Trt are acid labile protecting groups\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062446991_448\",\"type\":\"multiple_choice\",\"title\":\"Which deprotection method is commonly used for Cbz groups? \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Piperidine treatment\",\"Trifluoroacetic acid (TFA)\",\"Catalytic hydrogenation\",\"Sodium hydroxide\"],\"correctAnswer\":\"Catalytic hydrogenation\",\"hasCorrection\":true,\"readMoreBlocks\":[]},{\"id\":\"q_1780062446844_334\",\"type\":\"multiple_choice\",\"title\":\"Which pair would most likely show poor orthogonality? \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Fmoc / Boc\",\"Boc / tBu\",\"Alloc / Fmoc\",\"MOM / Fmoc\"],\"correctAnswer\":\"Boc / tBu\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Boc and tBu are both acid labile protecting groups\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062446689_187\",\"type\":\"multiple_choice\",\"title\":\"Which reagent is commonly used to remove Fmoc protecting groups? \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA\",\"HCl\",\"Piperidine\",\"Pd(PPh₃)₄\"],\"correctAnswer\":\"Piperidine\",\"hasCorrection\":true,\"readMoreBlocks\":[]},{\"id\":\"q_1780062446535_937\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group is commonly removed using palladium catalysis? \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Boc \",\"Alloc\",\"Fmoc\",\"Trt\"],\"correctAnswer\":\"Alloc\",\"hasCorrection\":true,\"readMoreBlocks\":[]},{\"id\":\"q_1780062446366_239\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group is generally stable under acidic conditions? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Boc \",\"tBu\",\"Trt\",\"Fmoc\"],\"correctAnswer\":\"Fmoc\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Fmoc group is removed with piperidine\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062577738_130\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group is usually cleaved with trifluoroacetic acid (TFA)? \",\"subtitle\":\"\",\"showExplanations\":false,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Fmoc\",\"Alloc\",\"Boc\",\"Cbz\"],\"correctAnswer\":\"Boc\",\"hasCorrection\":true,\"readMoreBlocks\":[]},{\"id\":\"q_1780062602816_636\",\"type\":\"multiple_choice\",\"title\":\"A peptide contains an Fmoc-protected N-terminus and a Boc-protected lysine side chain. Which treatment would selectively remove the Fmoc group while preserving the Boc group? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA in dichloromethane\",\"Piperidine in DMF\",\"H₂/Pd-C\",\"Strong HCl treatment\"],\"correctAnswer\":\"Piperidine in DMF\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Fmoc and Boc groups are considered orthogonal because they are removed through different reaction mechanisms. Fmoc is base-labile and is typically removed using secondary amines such as piperidine in DMF, whereas Boc is acid-labile and remains stable under basic conditions. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062633752_535\",\"type\":\"multiple_choice\",\"title\":\"A chemist wants to selectively deprotect an allyloxycarbonyl (Alloc) group in the presence of Fmoc and Boc protections. Which reagent would most likely achieve this selectively? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Piperidine\",\"TFA\",\"Pd(PPh₃)₄\",\"HBr in acetic acid\"],\"correctAnswer\":\"Pd(PPh₃)₄\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Alloc group can be selectively removed using palladium(0) catalysis, typically with Pd(PPh₃)₄. Fmoc groups are stable under Pd(0) conditions and require base for removal. Boc groups are also stable and require acidic conditions for cleavage. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062633567_318\",\"type\":\"multiple_choice\",\"title\":\"A molecule contains a Boc-protected amine and a benzyl-protected alcohol. Which sequence would allow selective deprotection of the alcohol first? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA followed by hydrogenation\",\"Hydrogenation followed by TFA\",\"Piperidine followed by TFA\",\"TFA followed by piperidine\"],\"correctAnswer\":\"Hydrogenation followed by TFA\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Benzyl protecting groups are typically removed by catalytic hydrogenation using H₂/Pd-C, whereas Boc groups are stable under these conditions. Therefore, hydrogenation selectively removes the benzyl-protected alcohol first. TFA treatment can then remove the Boc-protected amine.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062633438_530\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group would most likely survive both mild base treatment and catalytic hydrogenation? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Fmoc\",\"Cbz\",\"Alloc\",\"Boc\"],\"correctAnswer\":\"Boc\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Boc groups are generally stable under mild basic conditions and also resistant to catalytic hydrogenation. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062633293_916\",\"type\":\"multiple_choice\",\"title\":\"A molecule contains both Alloc- and Cbz-protected amines. Which strategy allows selective removal of the Alloc group first? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Hydrogenation with H₂/Pd-C\",\"Treatment with piperidine\",\"Palladium(0)-mediated deprotection\",\"TFA cleavage\"],\"correctAnswer\":\"Palladium(0)-mediated deprotection\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"A molecule contains both Alloc- and Cbz-protected amines. Which strategy allows selective removal of the Alloc group first? \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062633125_809\",\"type\":\"multiple_choice\",\"title\":\"A chemist wants to remove a tert-butyl ester without affecting an Fmoc-protected amine. Which condition is most appropriate? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Piperidine in DMF\",\"Catalytic hydrogenation\",\"TFA in dichloromethane\",\"Strong base at high temperature\"],\"correctAnswer\":\"Catalytic hydrogenation\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"/tert/-Butyl esters are typically removed under acidic conditions with TFA, while Fmoc groups remain stable under these conditions.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062894160_781\",\"type\":\"multiple_choice\",\"title\":\"A synthesis uses both Fmoc and Cbz protecting groups. Which sequence allows selective removal of each group? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA → hydrogenation\",\"Piperidine → hydrogenation\",\"Hydrogenation → TFA\",\"TFA → piperidine\"],\"correctAnswer\":\"Piperidine → hydrogenation\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Fmoc is removed under basic conditions (piperidine), whereas Cbz is stable to base and can later be removed selectively by hydrogenation.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062893920_697\",\"type\":\"multiple_choice\",\"title\":\"A molecule contains a PMB-protected alcohol and a TBDMS-protected alcohol. Which reagent would selectively remove the PMB group first? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TBAF\",\"DDQ\",\"Piperidine\",\"TFA\"],\"correctAnswer\":\"DDQ\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"PMB groups are commonly removed oxidatively using DDQ, whereas TBDMS groups are stable under these oxidation conditions.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062893532_963\",\"type\":\"multiple_choice\",\"title\":\"A synthetic intermediate contains both MOM and TBDMS ethers. Which treatment would most likely selectively remove the TBDMS group? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Dilute acid\",\"TBAF\",\"DDQ\",\"Pd(0) catalysis\"],\"correctAnswer\":\"TBAF\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"TBDMS groups are fluoride-sensitive and are efficiently removed with TBAF, while MOM ethers are generally stable under these conditions.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062893373_486\",\"type\":\"multiple_choice\",\"title\":\"Which protecting group is most compatible with repeated fluoride treatments?\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TBDMS\",\"SEM\",\"Troc\",\"Teoc\"],\"correctAnswer\":\"Troc\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"TBDMS, SEM and Teoc groups are fluoride-sensitive silyl-type protections, whereas Troc groups are typically removed reductively and are stable toward fluoride reagents.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062893218_954\",\"type\":\"multiple_choice\",\"title\":\"A substrate contains a Troc-protected amine and a Boc-protected amine. Which condition allows selective Troc removal? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA treatment\",\"Zn/AcOH reduction\",\"Piperidine in DMF\",\"DDQ oxidation\"],\"correctAnswer\":\"Zn/AcOH reduction\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Troc groups are commonly removed reductively using zinc in acetic acid, whereas Boc groups remain stable under these conditions.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780062893049_897\",\"type\":\"multiple_choice\",\"title\":\"Which pair of protecting groups provides the highest orthogonality? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"MOM / Boc\",\"PMB / TBDMS\",\"TBDMS / SEM\",\"MOM / SEM\"],\"correctAnswer\":\"PMB / TBDMS\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"PMB can be removed oxidatively (DDQ), while TBDMS is cleaved with fluoride sources, allowing highly selective removal.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063086487_765\",\"type\":\"multiple_choice\",\"title\":\"Which reagent is most commonly used for deprotection of TBDMS groups? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"DDQ\",\"Zn/AcOH\",\"TBAF\",\"H₂/Pd-C\"],\"correctAnswer\":\"TBAF\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Fluoride sources such as TBAF efficiently cleave silyl ethers like TBDMS.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063086145_997\",\"type\":\"multiple_choice\",\"title\":\"A chemist wants to selectively remove a Troc group while preserving a PMB ether. Which condition is most suitable? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"DDQ\",\"Zn/AcOH\",\"TBAF\",\"Dilute HCl\"],\"correctAnswer\":\"Zn/AcOH\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"Troc groups are reductively removed with zinc/acetic acid, while PMB ethers remain stable under these conditions.\",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063085834_595\",\"type\":\"multiple_choice\",\"title\":\"A substrate contains: (i) a SEM-protected alcohol; (ii) a PMB ether; and (iii) a Cbz-protected amine. The chemist wishes to remove the PMB group without affecting the other protections. Which of the following reagent is most appropriate?\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"TFA\",\"TBAF\",\"DDQ\",\"H₂/Pd-C\"],\"correctAnswer\":\"DDQ\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"PMB groups are selectively removed oxidatively using DDQ; SEM groups are generally stable under these oxidation conditions; Cbz groups are stable to DDQ and require hydrogenolysis for cleavage. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063085670_170\",\"type\":\"multiple_choice\",\"title\":\"A synthetic intermediate contains: (i) a TBDMS ether; (ii) a SEM ether and (iii) a MOM ether. After treatment with excess TBAF, both the TBDMS and SEM groups are removed, while the MOM group remains intact. Which of the following conclusions is most accurate?\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"MOM ethers are fluoride-sensitive\",\"SEM groups can display fluoride sensitivity similar to silyl ethers\",\"TBAF selectively removes all ether protecting groups\",\"MOM ethers are more labile than SEM groups\"],\"correctAnswer\":\"SEM groups can display fluoride sensitivity similar to silyl ethers\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"TBDMS and SEM groups are classically fluoride-labile. MOM ethers are generally stable toward fluoride reagents. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063085500_943\",\"type\":\"multiple_choice\",\"title\":\"A molecule containing a PMB ether and a benzyl ether is treated with DDQ. Which of the following outcomes is most likely?\",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"Both groups are removed simultaneously\",\"Only the benzyl ether is removed\",\"Only the PMB ether is removed\",\"Neither protecting group is affected\"],\"correctAnswer\":\"Only the PMB ether is removed\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"PMB ethers are electron-rich and highly susceptible to oxidative cleavage by DDQ. Benzyl ethers are much more resistant to oxidation and typically require hydrogenolysis. \",\"imageUrl\":\"\"}]},{\"id\":\"q_1780063229702_203\",\"type\":\"multiple_choice\",\"title\":\"Which of the following protecting group set would be LEAST suitable for a synthesis involving repeated acidic workups? \",\"subtitle\":\"\",\"showExplanations\":true,\"explanationCorrect\":\"\",\"explanationCorrectImage\":\"\",\"options\":[\"PMB / Cbz / Troc\",\"MOM / Boc / Trt\",\"TBDMS / PMB / Alloc\",\"SEM / PMB / Cbz\"],\"correctAnswer\":\"MOM / Boc / Trt\",\"hasCorrection\":true,\"readMoreBlocks\":[{\"text\":\"MOM, Boc, and Trt are all relatively acid-sensitive. Repeated acidic workups would increase the risk of premature or partial deprotection. The other combinations contain groups with more diverse deprotection mechanisms and therefore greater orthogonality.\",\"imageUrl\":\"\"}]}]}"

etone\"},{\"targetImage\":\"./uploads/1780078243474-5.png\",\"correctConditions\":\"H₂, Pd/C\"}],\"showExplanations\":false}]}"

  "about_content": "{\"title\":\"About the Platform\",\"subtitle\":\"Learn more about this project\",\"content\":\"**Authors:** Dr. Marta Planas, Mireia Serrat (Master's Student) \\n**Project Name:** PG Learn: Protecting Group Learning Platform\\n**Funding:** Grant for the Improvement of the Teaching Quality 2025 \\n**Date:** 2026 (First version)\\n**Department:** Department of Chemistry\\n**Institution:** University of Girona\\n\\n\\nThis project is an educational tool designed to help students master the most common protecting groups used in organic synthesis through practice, feedback, and active learning. It was developed as an initiative by Dr. M. Planas for the fourth-year course /Design of Organic Molecules/ (Chemistry degree, University of Girona) with the aim of enhancing students' understanding of protecting group strategies. Unlike many existing online resources, where protecting groups are typically presented as part of broader topics, this platform adresses them explicitly and in a structured way. It is based on a series of interactive test that provide users with immediate feedback, including corrections and suggestions for improvement.\\n\\nCompleted questionnaires can be printed and used as a personalized study guide, supporting continuous learning outside the platform.\\n\\n**The platform has been developed with a strong focus on privacy. It does not collect or store any personal user data. All progress and test activity are saved locally in the browser, ensuring that users maintain full control over their information.**\\n\\nQuestions can be addressed to marta.planas@udg.edu or mireiaserrat12@gmail.com. \\nSuggestions for improvement are very welcome! \"}",
  "landing_description": "This platform is designed to help users learn the most common protecting groups for the main functional groups in organic chemistry through interactive tests that provide instant feedback and detailed corrections. Completed questionnaires can be saved and used as personalized study guides. It does not store user data since everything is saved locally in the browser, ensuring privacy and security.",
  "landing_left_text": "Prior to completing the questionnaires below, students are required to read *Chapter 3*. \n\nThe contents of this chapter are: ",
  "landing_left_btn1_label": "Chapter 3",
  "landing_left_btn1_text": "*Description of the contents of the documents of chapter 3* \n\n*Section 3.1.* General features of a protecting group. Concepts of functional group compatibility and orthogonality. \n\n*Section 3.2.* Classification of protecting groups according to the cleavage conditions. In this section, the different protecting groups are grouped according to the conditions needed for their removal. The mechanism of removal is also included. At the end of this section , the student should be able to predict the removal conditions for a given protecting group based on its structure. The protecting groups are drawn in black and the functional group that is protected is drawn in red. \n\n*Section 3.3.* Functional group protection. This section covers the most important protecting groups for hydroxyl, carbonyl, and amino groups. The conditions for the introduction and removal of each protecting group are detailed. \n\nIt should be mentioned that the contents of these two sections are complementary.",
  "landing_left_btn1_url": "./uploads/1780385558766-Chapter 3.pdf",
  "landing_left_btn2_label": "Learning Outcomes ",
  "landing_left_btn2_text": "This platform aims to enable students to achieve the following learning outcomes: \n- Explain the role of protecting groups \n- Define and distinguish between the concepts of compatibility and orthogonality in protecting group strategies \n- Identify and provide examples of protecting groups that can be removed under different reaction conditions \n- Describe the conditions for the introduction and removal of the most common protecting groups for hydroxyl, carbonyl, carboxyl, and amino groups",
  "landing_goals": "This platform aims to enable students to achieve the following learning outcomes: \n- Explain the role of protecting groups. \n- Define and distinguish between the concepts of compatibility and orthogonality in protecting group strategies. \n- Identify and provide examples of protecting groups that can be removed under different reaction conditions. \n- Describe the conditions for the introduction and removal of the most common protecting groups for hydroxyl, carbonyl, carboxyl, and amino groups. "
};
